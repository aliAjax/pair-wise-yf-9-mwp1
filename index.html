<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌游规则遗忘点卡片库</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">聚会前快速复习</p>
          <h1>桌游规则遗忘点卡片库</h1>
        </div>
        <div class="summary">
          <div>
            <span>收藏</span>
            <strong id="gameCount">0</strong>
          </div>
          <div>
            <span>遗忘点</span>
            <strong id="ruleCount">0</strong>
          </div>
          <div>
            <span>最久未玩</span>
            <strong id="staleGame">-</strong>
          </div>
        </div>
      </header>

      <section class="controls">
        <label>
          搜索
          <input id="searchInput" type="search" placeholder="游戏名或规则关键词" />
        </label>
        <label>
          人数
          <select id="playerFilter">
            <option value="all">全部</option>
            <option value="2">适合2人</option>
            <option value="3">适合3人</option>
            <option value="4">适合4人</option>
            <option value="5">适合5人</option>
          </select>
        </label>
        <label>
          复杂度
          <select id="complexityFilter">
            <option value="all">全部</option>
            <option value="轻">轻</option>
            <option value="中">中</option>
            <option value="重">重</option>
          </select>
        </label>
        <label>
          排序
          <select id="sortMode">
            <option value="stale">最近未玩</option>
            <option value="name">名称</option>
            <option value="complexity">复杂度</option>
          </select>
        </label>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>新增桌游</h2>
          <form id="gameForm" class="game-form">
            <label>
              名称
              <input id="nameInput" required placeholder="例：勃艮第城堡" />
            </label>
            <div class="split">
              <label>
                最少人数
                <input id="minPlayersInput" type="number" min="1" max="12" value="2" required />
              </label>
              <label>
                最多人数
                <input id="maxPlayersInput" type="number" min="1" max="12" value="4" required />
              </label>
            </div>
            <div class="split">
              <label>
                时长分钟
                <input id="durationInput" type="number" min="5" value="90" required />
              </label>
              <label>
                复杂度
                <select id="complexityInput">
                  <option value="轻">轻</option>
                  <option value="中" selected>中</option>
                  <option value="重">重</option>
                </select>
              </label>
            </div>
            <label>
              上次游玩
              <input id="lastPlayedInput" type="date" required />
            </label>
            <label>
              封面图
              <input id="coverInput" type="file" accept="image/*" />
            </label>
            <button class="primary" type="submit">加入收藏</button>
          </form>
        </aside>

        <section class="panel list-panel">
          <div class="panel-head">
            <h2>收藏列表</h2>
            <span id="visibleCount"></span>
          </div>
          <div id="gameList" class="game-list"></div>
        </section>

        <aside class="panel detail-panel">
          <div id="detailView"></div>
        </aside>
      </section>
    </main>

    <div class="modal-backdrop" id="revisionModal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="revisionTitle">
        <div class="modal-head">
          <h2 id="revisionTitle">规则修订</h2>
          <button type="button" id="revisionClose" class="icon-btn" aria-label="关闭">×</button>
        </div>
        <p class="modal-tip">新增、移除或改正规则都必须填写修订人与修订原因，缺任一项整次拒绝，规则保持不变。</p>
        <form id="revisionForm" class="modal-form">
          <div id="sectionGroup">
            <label>
              规则分类
              <select id="revisionRuleKey">
                <option value="forgets">容易忘的规则</option>
                <option value="disputes">常见争议</option>
                <option value="setup">开局准备</option>
                <option value="scoring">计分提醒</option>
              </select>
            </label>
          </div>
          <div id="oldRuleGroup" hidden>
            <div class="field-label">原规则</div>
            <p id="oldRuleText" class="old-rule"></p>
          </div>
          <div id="newRuleGroup">
            <label>
              <span id="newRuleLabel">规则内容</span>
              <textarea id="newRuleText" rows="3" placeholder="请填写修订后的规则内容"></textarea>
            </label>
          </div>
          <label>
            修订人
            <input id="revisionEditor" type="text" placeholder="例：阿明" required />
          </label>
          <label>
            修订原因
            <textarea id="revisionReason" rows="2" placeholder="例：说明书第 6 页写明先结算事件再行动" required></textarea>
          </label>
          <p class="modal-error" id="revisionError" hidden></p>
          <div class="modal-actions">
            <button type="button" id="revisionCancel">取消</button>
            <button type="button" class="primary" id="revisionConfirm">确认修订</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-backdrop" id="versionModal" hidden>
      <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="versionTitle">
        <div class="modal-head">
          <h2 id="versionTitle">版本详情</h2>
          <button type="button" id="versionClose" class="icon-btn" aria-label="关闭">×</button>
        </div>
        <div class="version-meta-block" id="versionMeta"></div>
        <div id="versionBody" class="version-body"></div>
        <p class="modal-error" id="versionError" hidden></p>
        <div id="rollbackPanel" class="rollback-panel" hidden>
          <p class="modal-tip">回滚只恢复该版本的规则内容，并生成一条新的“回滚”版本，被回滚到的旧版本和之后的历史版本都会继续保留。需填写修订人与原因。</p>
          <label>
            修订人
            <input id="rollbackEditor" type="text" placeholder="执行回滚的人" required />
          </label>
          <label>
            修订原因
            <textarea id="rollbackReason" rows="2" required></textarea>
          </label>
        </div>
        <p class="modal-tip current-hint" id="currentVersionHint" hidden>这是当前版本，无需回滚。</p>
        <div class="modal-actions">
          <button type="button" id="versionCancel">关闭</button>
          <button type="button" class="primary" id="rollbackConfirmBtn">回滚到此版本</button>
        </div>
      </div>
    </div>

    <script src="rules.js"></script>
    <script src="versions.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
